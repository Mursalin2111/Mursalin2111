<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyber Shield & Accent Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cyber-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow-cyber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #00f2fe;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .terminal-decor {
      font-family: 'Fira Code', monospace, monospace;
      font-size: 12px;
      fill: #334155;
    }
  </style>

  <!-- Container Box with Cyber Border -->
  <rect width="850" height="200" rx="16" fill="url(#cyber-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="730" cy="70" r="110" fill="#0284c7" fill-opacity="0.15" filter="url(#glow-cyber)" />
  <circle cx="120" cy="180" r="80" fill="#10b981" fill-opacity="0.12" filter="url(#glow-cyber)" />

  <!-- Cyber Wave Overlay -->
  <path d="M0 160 C 220 135, 380 180, 580 148 C 720 125, 780 160, 850 145 L 850 200 L 0 200 Z" fill="url(#cyber-wave)" />

  <!-- Cyber Matrix Dots Pattern on Right -->
  <g fill="#1e293b" opacity="0.6">
    <circle cx="630" cy="50" r="2" />
    <circle cx="655" cy="50" r="2" />
    <circle cx="680" cy="50" r="2" />
    <circle cx="705" cy="50" r="2" />
    <circle cx="630" cy="75" r="2" />
    <circle cx="655" cy="75" r="2" />
    <circle cx="680" cy="75" r="2" />
    <circle cx="705" cy="75" r="2" />
    <circle cx="630" cy="100" r="2" />
    <circle cx="655" cy="100" r="2" />
    <circle cx="680" cy="100" r="2" />
    <circle cx="705" cy="100" r="2" />
    <circle cx="630" cy="125" r="2" />
    <circle cx="655" cy="125" r="2" />
    <circle cx="680" cy="125" r="2" />
    <circle cx="705" cy="125" r="2" />
  </g>

  <!-- Left Content Group -->
  <g transform="translate(50, 46)">
    <!-- Pill Badge with ample width -->
    <rect width="215" height="26" rx="13" fill="url(#pill-grad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" class="badge">CYBERSECURITY EXPERT</text>

    <!-- Main Title -->
    <text x="0" y="68" class="title">Md Mursalin</text>

    <!-- Subtitle -->
    <text x="0" y="98" class="subtitle">Ethical Hacking &amp; Network Defense • CSE Undergrad @ Green University</text>
  </g>

  <!-- Cyber Security Shield Graphic on Right -->
  <g transform="translate(720, 52)">
    <!-- Outer Shield Glow -->
    <path d="M 40 5 L 75 22 C 75 55, 55 85, 40 95 C 25 85, 5 55, 5 22 Z" 
          stroke="url(#shield-grad)" stroke-width="2.5" fill="#040812" fill-opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Lock / Core Symbol -->
    <!-- Lock Shackle -->
    <path d="M 32 45 L 32 37 C 32 32, 48 32, 48 37 L 48 45" 
          stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Lock Body -->
    <rect x="28" y="45" width="24" height="20" rx="4" 
          fill="url(#shield-grad)" stroke="#00f2fe" stroke-width="1" />
    <!-- Keyhole -->
    <circle cx="40" cy="53" r="2.5" fill="#040812" />
    <line x1="40" y1="55" x2="40" y2="60" stroke="#040812" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
