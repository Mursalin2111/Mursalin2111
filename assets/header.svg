<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Container Box with Rounded Borders -->
  <rect width="850" height="200" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Decorative Shapes -->
  <circle cx="750" cy="50" r="130" fill="url(#accent-glow)" filter="url(#glow)" />
  <circle cx="100" cy="180" r="90" fill="url(#accent-glow)" filter="url(#glow)" />

  <!-- Flowing Waves -->
  <path d="M0 160 C 200 130, 350 185, 550 150 C 700 120, 780 160, 850 145 L 850 200 L 0 200 Z" fill="url(#wave-grad)" />

  <!-- Grid Dots pattern on Right -->
  <g fill="#334155" opacity="0.4">
    <circle cx="680" cy="60" r="2" />
    <circle cx="710" cy="60" r="2" />
    <circle cx="740" cy="60" r="2" />
    <circle cx="770" cy="60" r="2" />
    <circle cx="800" cy="60" r="2" />
    <circle cx="680" cy="90" r="2" />
    <circle cx="710" cy="90" r="2" />
    <circle cx="740" cy="90" r="2" />
    <circle cx="770" cy="90" r="2" />
    <circle cx="800" cy="90" r="2" />
    <circle cx="680" cy="120" r="2" />
    <circle cx="710" cy="120" r="2" />
    <circle cx="740" cy="120" r="2" />
    <circle cx="770" cy="120" r="2" />
    <circle cx="800" cy="120" r="2" />
  </g>

  <!-- Content Group -->
  <g transform="translate(50, 48)">
    <!-- Category Pill -->
    <rect width="185" height="24" rx="12" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#38bdf8" />
    <text x="26" y="16" class="badge">SOFTWARE DEVELOPER</text>

    <!-- Main Title -->
    <text x="0" y="66" class="title">Md Mursalin</text>

    <!-- Subtitle -->
    <text x="0" y="96" class="subtitle">Android App Developer &amp; CSE Undergraduate • Green University of Bangladesh</text>
  </g>

  <!-- Graphic Code Bracket on Right -->
  <g transform="translate(670, 70)" stroke="url(#accent-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- < / > Symbol -->
    <path d="M 15 15 L 0 30 L 15 45" />
    <path d="M 50 15 L 65 30 L 50 45" />
    <path d="M 38 10 L 27 50" />
  </g>
</svg>
